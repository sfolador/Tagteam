<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Tagteam — Fit together</title>
  <desc>Two complementary account tiles nest at a rounded corner, separated by a narrow ivory seam. No arrow.</desc>
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="65%" y2="100%">
      <stop stop-color="#FFFEFA"/><stop offset="1" stop-color="#EDE9E1"/>
    </linearGradient>
    <linearGradient id="slate" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop stop-color="#475765"/><stop offset="1" stop-color="#273440"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop stop-color="#F08760"/><stop offset="0.5" stop-color="#E86D45"/><stop offset="1" stop-color="#D85935"/>
    </linearGradient>
    <path id="shell" d="M332 100 H692 C852 100 924 172 924 332 V692 C924 852 852 924 692 924 H332 C172 924 100 852 100 692 V332 C100 172 172 100 332 100 Z"/>
  </defs>
  <!-- Layered vector penumbra: soft shadow without a renderer-specific filter. -->
  <g fill="none" stroke="#1C2833" transform="translate(0 14)">
    <use xlink:href="#shell" stroke-width="64" opacity="0.008"/>
    <use xlink:href="#shell" stroke-width="48" opacity="0.012"/>
    <use xlink:href="#shell" stroke-width="32" opacity="0.020"/>
    <use xlink:href="#shell" stroke-width="18" opacity="0.035"/>
    <use xlink:href="#shell" stroke-width="8" opacity="0.055"/>
  </g>
  <use xlink:href="#shell" fill="url(#body)"/>
  <use xlink:href="#shell" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75"/>
  <!-- Rear account: slate, with a quiet lower shadow and fine edge light. -->
  <rect x="246" y="256" width="370" height="370" rx="92" fill="#26313C" opacity="0.08"/>
  <rect x="246" y="246" width="370" height="370" rx="92" fill="url(#slate)"/>
  <rect x="248" y="248" width="366" height="366" rx="90" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.12"/>
  <!-- An ivory seam preserves both silhouettes around the complementary notch. -->
  <path d="M652 408 H686 Q778 408 778 500 V686 Q778 778 686 778 H500 Q408 778 408 686 V652 Q408 628 432 628 H524 Q628 628 628 524 V432 Q628 408 652 408 Z" transform="translate(0 10)" fill="#452B21" opacity="0.09"/>
  <path d="M652 408 H686 Q778 408 778 500 V686 Q778 778 686 778 H500 Q408 778 408 686 V652 Q408 628 432 628 H524 Q628 628 628 524 V432 Q628 408 652 408 Z" fill="url(#orange)"/>
  <path d="M652 408 H686 Q778 408 778 500 V686 Q778 778 686 778 H500 Q408 778 408 686 V652 Q408 628 432 628 H524 Q628 628 628 524 V432 Q628 408 652 408 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.20"/>
</svg>
